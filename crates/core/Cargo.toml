[package]
name = "coalesce-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "coalesce_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
futures = "0.3.34"
hex = "0.4.3"
hkdf = "0.13.0"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rand = "0.10.2"
rcgen = "0.14.10"
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
mdns-sd = "0.21"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "fs", "io-util", "sync", "macros", "time", "signal"] }
tokio-util = { version = "0.7.19", features = ["io"] }
uuid = { version = "1.26.1", features = ["v4"] }
walkdir = "2.5.0"

[dev-dependencies]
blake3 = "1.8.7"
hex = "0.4.3"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }

# 只有 Unix 需要：posix_fallocate / statvfs 用来真正预留磁盘空间
# 并取回可用空间。Windows 侧走 set_len + SetEndOfFile，不需要额外依赖。
[target.'cfg(unix)'.dependencies]
libc = "0.2"
